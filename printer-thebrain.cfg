#####################################################################
#####################################################################
#   Frame - Mercury One Plus / Ender 5 Plus
#   Motherboard - BTT Octopus 1.1
#####################################################################
#####################################################################


#####################################################################
#   Printer Settings
#####################################################################
# For Custom Macros
[gcode_macro _Printer_Variables]
variable_startupinit:            False          ## run initialization on startup
variable_max_bed_x:              377
variable_max_bed_y:              370
variable_max_bed_z:              380
variable_feedlength:             125            ## this should represent the distance from when filament enters the gears through the nozzle clean
variable_feedforce:              'extruder'     ## the extruder name
variable_etemp:                  184            ## minimum melt temp for the hardest filament normally used
variable_btemp:                  50             ## minimum bed temp used
variable_warmonboot:             1              ## warm the bed and extruder to minimum temps on power up
variable_retractspeed:           300            ## filament retraction speed
variable_dockableprobe:          1              ## is the system using a dockable probe
variable_ztiltadjust:            1              ## 2/3 way auto z-tilt adjust
variable_autozcalibrate:         1              ## automatic Z calibration on or off
variable_bedmeshonprint:         1              ## 0 never, 1 every, 2+ on interval
variable_bedmeshtype:            1              ## 1 adaptive, 2 full
variable_wipeline:               0              ## use a wipe line/purge
variable_main_panel:             1              ## does a main neopixel panel exist
variable_bed_panel:              0              ## does a bed mounted neopixel panel exist
variable_lowerbedoncancel:       1              ## lower the bed when a print is cancelled, as PRINT_END does
gcode:

# For Mainsail Macros
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos.   :   False     ; use custom park coordinates for x,y [True/False]
#variable_custom_park_x    :     0.0   ; custom x position; value must be within your defined min and max of X
#variable_custom_park_y    :     0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz    :    15.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract           :     1.0   ; the value to retract while PAUSE
variable_cancel_retract    :     5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract     :    35.0  ; retract speed in mm/s
variable_unretract         :     1.0   ; the value to unretract while RESUME
variable_speed_unretract   :    35.0  ; unretract speed in mm/s
variable_speed_hop         :    40.0  ; z move speed in mm/s
variable_speed_move        :   100.0 ; move speed in mm/s
variable_park_at_cancel    :    True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x :    None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y :    None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_user_pause_macro  : "_PAUSE_HOOK"   ; executed after the klipper base pause (PAUSE_BASE)
variable_user_resume_macro : "_RESUME_HOOK"  ; executed before the klipper base resume (RESUME_BASE)
variable_user_cancel_macro : "_CANCEL_HOOK"  ; executed before the klipper base cancel (CANCEL_PRINT_BASE)
gcode:

[safe_z_home]
home_xy_position:     388,81
speed:                120
z_hop:                20

# With Z unhomed, safe_z_home starts every G28 by dropping the bed z_hop mm
# without knowing where it is. After a print the bed is parked near the bottom
# of its travel (and settles about 10 mm further when the motors release), so
# that hop pulled it against the bottom stops and the Z belts skipped.
#
# PRINT_END and the cancel hook record bed_parked_low=1 in save_variables after
# lowering the bed. When that is set, Z is unhomed and both Z motors are off,
# this wrapper tells Klipper the bed is near the bottom: safe_z_home then sees
# a homed Z above z_hop and skips the hop. The value is 25 mm short of
# position_max on purpose, so Klipper never believes the bed is further away
# than it is. Z is homed for real straight afterwards and the record is
# cleared, so after anything other than a normal print end or cancel (an
# error, an emergency stop, a power cut) the hop still protects the print.
[gcode_macro G28]
rename_existing: G28.1
gcode:
  {% set motors = printer.stepper_enable.steppers %}
  {% set parked = printer.save_variables.variables.bed_parked_low|default(0)|int == 1 %}
  {% set skip_hop = parked and "z" not in printer.toolhead.homed_axes and not motors.stepper_z and not motors.stepper_z1 %}
  {% set homes_z = rawparams|trim == "" or "Z" in rawparams|upper %}
  {% if skip_hop %}
    SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z - 25} SET_HOMED=z
  {% endif %}
  G28.1 {rawparams}
  {% if skip_hop and not homes_z %}
    SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=z
  {% endif %}
  {% if parked and homes_z %}
    SAVE_VARIABLE VARIABLE=bed_parked_low VALUE=0
  {% endif %}

[dockable_probe]
dock_position:             210.5,384
approach_position:         210.5,360
detach_position:           235,384
z_hop:                     20

[bed_mesh]
# 33 mm between points instead of the frame file's 56 mm (7,7). The plate's
# dome climbs 0.27 mm between neighbouring points of the coarser grid, and
# single-layer patches came out 0.07 mm different across one plate. An
# adaptive mesh scales this count to the print area. See docs/thebrain.md.
probe_count: 11,11
# The probe triggers at about Z 8.5 at the highest part of the plate, so the
# frame file's 15 lowered the bed 6.5 mm between points and raised it again at
# 5 mm/s. 11 leaves 2.5 mm. The mesh runs after Z_TILT_ADJUST, which keeps its
# own 15 because the bed can be 1.6 mm out of level before it.
horizontal_move_z: 11

[z_calibration]
nozzle_xy_position:   388,81  # <X,Y position for clicking the nozzle on the Z endstop>
switch_xy_position:   383,64  # <X,Y position for clicking the probe's switch body on the Z endstop>
switch_offset:        0.385    # <offset of the switch trigger (larger number means closer to the bed)>
safe_z_height:        20
speed:                120
probing_first_fast:   True
probing_speed:        5
probing_second_speed: 2
probing_retract_dist: 0.5
start_gcode:          #<macro name for attaching the probe>
     ATTACH_PROBE
# No end_gcode. PRINT_START keeps the probe attached for the bed mesh that
# follows CALIBRATE_Z and detaches it afterwards. Do not add DETACH_PROBE
# here: the mesh would then run with no probe on the toolhead.

[extruder]
rotation_distance: 22.2662775
#####################################################################


#####################################################################
#   Startup
#####################################################################
# startupinit is off, so nothing else sets the LEDs or starts the idle
# timer at power on. The dwell counts as activity, which lets a printer
# that is switched on and never used reach the idle timeout and power off.
[delayed_gcode STARTUP_IDLE]
initial_duration: 2
gcode:
  {% if printer.print_stats.state == "standby" %}
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=printer_idle FADETIME=1.0
    G4 P1
  {% endif %}
#####################################################################


#####################################################################
#   Electronics
#####################################################################
[mcu] ## BTT SKR Mini E3 V3
serial: /dev/ttyAMA0
baud: 500000
restart_method: command

[mcu head0]
canbus_uuid: 68f0a29b43c0
#####################################################################


#####################################################################
#   LED Effects
#####################################################################
[led_effect printer_init]
autostart:              False
frame_rate:             24
leds:
  neopixel:main
layers:
  comet 0.25 1 add (.5,0,0),(.2,0,0)
  comet -0.25 1 add (.5,0,0),(.2,0,0)
  static 0 0 bottom (0,0,0)

[led_effect printer_idle]
autostart:              False
frame_rate:             24
leds:
  neopixel:main
layers:
  breathing 10 1 top (.5,0,0)

[led_effect printer_active]
autostart:              False
frame_rate:             24
leds:
  neopixel:main
layers:
  progress -1 0 add      (0,.5,0),(0,.5,0)
  progress -1 0 subtract (.5,0,0),(.5,0,0)
  static    0 0 top      (.5,0,0)

[led_effect printer_complete]
autostart:              False
frame_rate:             24
leds:
  neopixel:main
layers:
  static 0 0 top (0,.5,0)

[led_effect printer_pause]
autostart:              False
frame_rate:             24
leds:
    neopixel:main
layers:
  comet  0.25 1 top (.5,.5,0),(.2,.2,0)
  static 0 0 bottom (.5,0,0)

[led_effect printer_cancel]
autostart:              False
frame_rate:             24
leds:
  neopixel:main
layers:
  static 0 0 top (.5,.5,0)

[led_effect printer_error]
autostart:              False
frame_rate:             24
run_on_error:           True
leds:
    neopixel:main
layers:
    strobe 1 1.5 top (.5,.5,0)
#####################################################################
