#
# Modern Tinkerer - https://github.com/Modern-Tinkerer
#

#####################################################################
#####################################################################
#   Nozzle Wipe Line
#####################################################################
#####################################################################

# With SIZE=<xmin>_<ymin>_<xmax>_<ymax> (the first-layer bounds PRINT_START gets
# from the slicer) one line is drawn 5 mm to the left of the print, or to the
# right when there is no room on the left. Without SIZE the fixed lines at X350
# are drawn as before. The idea is Klippain's adaptive prime line.
[gcode_macro WIPE_LINE]
variable_margin: 5.0   ## mm between the line and the print's first-layer bounds
variable_length: 60.0  ## mm of line
variable_edge:   5.0   ## mm kept clear of the bed edges
gcode:
    {% set N = params.N|default(0.4)|float %}
    {% set box = params.SIZE|default("0_0_0_0")|string %}
    {% set box = box.split('_')|map('float')|list %}
    {% set sized = box|length == 4 and box[2] > box[0] and box[3] > box[1] %}
    {% set pv = printer["gcode_macro _Printer_Variables"] %}
    {% set bed_x = pv.max_bed_x|default(printer.toolhead.axis_maximum.x)|float %}
    {% set bed_y = pv.max_bed_y|default(printer.toolhead.axis_maximum.y)|float %}
    {% if sized %}
      {% set x = box[0] - margin if box[0] - margin >= edge else box[2] + margin %}
      {% set y = [[box[1], edge]|max, bed_y - edge - length]|min %}
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
    {% elif printer.extruder.temperature < 170 %}
    {action_respond_info("Extruder temperature too low")}
    {% elif sized and (x > bed_x - edge or y < edge) %}
    {action_respond_info("No room beside the print for a prime line, skipped")}
    {% elif sized %}
    {% set h = (N * 0.75)|round(3) %}
    {% set fd = printer.configfile.settings.extruder.filament_diameter|float %}
    {% set e = (h * N * 1.5 * length / (3.14159 * (fd / 2) ** 2))|round(3) %}
    SAVE_GCODE_STATE NAME=WIPE_LINE_state
    G90
    M83
    G1 X{x|round(2)} Y{y|round(2)} F5000 ; move beside the print
    G1 Z{h} F240
    G1 Y{(y + length)|round(2)} E{e} F1500 ; one line, 1.5 nozzle widths wide
    G1 Z{(h + 2)|round(3)} F240 ; lift clear of the line
    RESTORE_GCODE_STATE NAME=WIPE_LINE_state
    {% else %}
    SAVE_GCODE_STATE NAME=WIPE_LINE_state
    M82
    G90
    G92 E0
    G1 X350 Y300 F5000 ; move to starting location
    G1 Z{N*0.75} F240
    G92 E0
    G1 X350 Y200 E9.5 F1500 ; prime the nozzle
    G92 E0
    G1 X{350+(N*2)} F1500
    G1 X{350+(N*2)} Y300 E9.5 F1500 ; wipe backward
    G92 E0
    G1 X{350+N} F1500
    G1 X{350+N} Y155 E11 F1500 ; wipe forward
    G92 E0
    RESTORE_GCODE_STATE NAME=WIPE_LINE_state
    {% endif %}
