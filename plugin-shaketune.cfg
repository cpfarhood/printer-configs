#####################################################################
#   Shake&Tune
#####################################################################
# Belt, input shaper and vibration graphs from the toolhead accelerometer.
# https://github.com/Frix-x/klippain-shaketune
#
# Include this file only on a host where Shake&Tune is installed. Klipper
# will not start with a [shaketune] section and no plugin behind it.
# What the installer does and what is unverified on Kalico is written up
# in docs/thebrain.md under "Open items", "Host".
#
# Needs [resonance_tester] and an accelerometer, which the toolhead file
# already defines. All options below are the plugin's defaults.
[shaketune]
#result_folder: ~/printer_data/config/ShakeTune_results
#number_of_results_to_keep: 10
#keep_raw_data: False
#show_macros_in_webui: True
#timeout: 600
#####################################################################
