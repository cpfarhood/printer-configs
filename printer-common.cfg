#####################################################################
#      Common Settings
#####################################################################
[save_variables]
filename: ~/printer_data/config/variables.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes/

[exclude_object]

[idle_timeout]
timeout: 600
gcode:
  {% if printer.pause_resume.is_paused %}
    # paused print: keep the bed hot and the motors on, RESUME reheats the hotend
    M104 S0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    UPDATE_DELAYED_GCODE ID=PAUSE_GIVE_UP DURATION=14400
  {% else %}
    M84
    TURN_OFF_HEATERS
    M106 S255
    UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=30
  {% endif %}

[delayed_gcode PAUSE_GIVE_UP]
gcode:
  {% if printer.pause_resume.is_paused and printer.idle_timeout.state == "Idle" %}
    CANCEL_PRINT
    M84
    TURN_OFF_HEATERS
    M106 S255
    UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=30
  {% endif %}

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor RPi]
sensor_type: temperature_host
min_temp: 5
max_temp: 125

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 5
max_temp: 125